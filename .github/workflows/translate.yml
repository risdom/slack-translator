name: Translate CS channels

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      backfill_minutes:
        description: "Look back this many minutes (ignores saved position)"
        default: "0"
      only:
        description: "all, text or audio"
        default: "all"
      test_dm:
        description: "Send to the owner's DM instead of the channels"
        default: "false"

permissions:
  contents: write

concurrency: translate

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Models (cached once)
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.cache/huggingface
          key: models-v1
      - name: Restore last position
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: position-${{ github.run_id }}
          restore-keys: position-
      - run: pip install --quiet -r requirements.txt
      - name: Translate new messages
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TRANSLATE_CHANNELS: ${{ secrets.TRANSLATE_CHANNELS }}
          OWNER: ${{ secrets.OWNER }}
          BACKFILL_MIN: ${{ inputs.backfill_minutes }}
          ONLY: ${{ inputs.only || 'audio' }}   # text is handled instantly by the Cloudflare Worker (worker/)
          TEST_DM: ${{ inputs.test_dm }}
        run: |
          if [ -n "$BACKFILL_MIN" ] && [ "$BACKFILL_MIN" != "0" ]; then rm -f state.json; fi
          python translate.py
      - name: Save position
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: position-${{ github.run_id }}
      - name: Keep the schedule alive (GitHub pauses idle public repos after 60 days)
        run: |
          last=$(git log -1 --format=%ct); if [ $(( $(date +%s) - last )) -gt $((45*86400)) ]; then
            git config user.name "translator-bot"; git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "keepalive" && git push; fi
