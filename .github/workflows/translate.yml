name: Translate CS channels

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      backfill_minutes:
        description: "Look back this many minutes (ignores saved position)"
        default: "0"

permissions:
  contents: write

concurrency: translate

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore last position + models
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            ~/.local/share/argos-translate
            ~/.cache/huggingface
          key: translator-${{ github.run_id }}
          restore-keys: translator-
      - run: pip install --quiet -r requirements.txt
      - name: Translate new messages
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TRANSLATE_CHANNELS: ${{ secrets.TRANSLATE_CHANNELS }}
          OWNER: ${{ secrets.OWNER }}
          BACKFILL_MIN: ${{ inputs.backfill_minutes }}
        run: |
          if [ -n "$BACKFILL_MIN" ] && [ "$BACKFILL_MIN" != "0" ]; then rm -f state.json; fi
          python translate.py
      - name: Save position + models
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            ~/.local/share/argos-translate
            ~/.cache/huggingface
          key: translator-${{ github.run_id }}
      - name: Keep the schedule alive (GitHub pauses idle public repos after 60 days)
        run: |
          last=$(git log -1 --format=%ct); if [ $(( $(date +%s) - last )) -gt $((45*86400)) ]; then
            git config user.name "translator-bot"; git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "keepalive" && git push; fi
